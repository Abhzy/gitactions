name: Python CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint

    - name: Run Python script
      run: python x.py

    - name: Run Pylint
      run: pylint x.py

    - name: Run Unit Tests
      run: |
        # Python's built-in unit testing framework is typically invoked via unittest. 
        # If you have a test file, run it here (e.g., python -m unittest test_x.py)
        python -m unittest discover || echo "No unit test files found."


